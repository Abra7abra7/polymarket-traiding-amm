app:
  dry_run: true
  environment: production
  name: polymarket-amm-bot
  paper_trading: true
  version: 1.0.0
exchange:
  amm:
    base_url: https://gamma-api.polymarket.com
    gas_limit: 300000
    gas_price_gwei: 2
    router_address: '0x0000000000000000000000000000000000000000'
    timeout: 10
  auth:
    private_key: ${POLYMARKET_PRIVATE_KEY}
    wallet_address: ${POLYMARKET_WALLET_ADDRESS}
    builder_code: ${POLYMARKET_BUILDER_CODE} # Attribution code for V2
    signature_type: 1 # 0=EOA, 1=Proxy, 2=Safe
  platform: polymarket
monitoring:
  data_dir: ~/.trading_bot
  fill_latency_ms: 200
  health:
    enabled: true
    port: 8089
  log_level: INFO
  metrics:
    enabled: true
    port: 9093
  metrics_port: 9093
  partial_fill_prob: 0.1
  slippage_bps: 50
  spread_bps: 200
paper_trading:
  data_dir: ~/.trading_bot
  fill_latency_ms: 200
  initial_balance: 5000.0
  partial_fill_prob: 0.1
  slippage_bps: 50
  spread_bps: 200
  swap_fee_bps: 200          # 2% swap fee (Polymarket AMM fee)
  gas_fee_usd: 0.01           # gas fee on Polygon (~$0.01 per trade)
risk:
  kill_switches:
    daily_loss_limit_usd: 1000
  max_daily_trades: 50
  max_drawdown: 0.1
  max_open_positions: 15
  max_position_size_usd: 1000
  max_total_exposure_usd: 10000
storage:
  checkpoint:
    enabled: true
    interval_minutes: 60
    path: ~/.trading_bot/checkpoint.json
  redis:
    db: 0
    host: localhost
    matrix_ttl: 3600
    port: 6379
    prefix: 'trading:'
