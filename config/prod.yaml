app:
  name: polymarket-live-bot
  version: 1.0.0
  environment: production
  dry_run: false

exchange:
  platform: polymarket
  api:
    base_url: https://api.polymarket.com
    ws_url: wss://api.polymarket.com/market/v1
    timeout: 10
    max_retries: 3
    backoff_factor: 2.0
    key_env: POLYMARKET_API_KEY
    secret_env: POLYMARKET_API_SECRET
  auth:
    method: api_key  # or "wallet_signature"
  wallet:
    address_env: POLYMARKET_WALLET_ADDRESS
    private_key_env: POLYMARKET_PRIVATE_KEY

trading:
  assets:
    BTC:
      symbol: BTC
      market_id: ${BTC_MARKET_ID}  # filled from env or override
      windows:
      - 1h
      - 6h
      enabled: true
      max_position_usd: 30
    ETH:
      symbol: ETH
      market_id: ${ETH_MARKET_ID}
      windows:
      - 1h
      - 6h
      enabled: true
      max_position_usd: 30
    TAO:
      symbol: TAO
      market_id: ${TAO_MARKET_ID}
      windows:
      - 1h
      - 6h
      enabled: true
      max_position_usd: 25
    HYPERLIQUID:
      symbol: HL
      market_id: ${HL_MARKET_ID}
      windows:
      - 1h
      - 6h
      enabled: true
      max_position_usd: 25
  default_window: 1h
  min_confidence: 0.55          # p_hat threshold to enter
  stop_loss_usd: 5
  take_profit_usd: 7.5
  max_positions: 4
  max_total_exposure_usd: 120
  position_sizing:
    method: kelly
    fraction: 0.25

risk:
  max_daily_loss_usd: 15
  max_drawdown_pct: 10
  max_positions_per_asset: 2
  circuit_breaker:
    enabled: true
    unrealized_loss_threshold_usd: 20
    flat_after_minutes: 5

portfolio:
  initial_capital: 300
  currency: USD

monitoring:
  log_level: INFO
  checkpoint_interval_seconds: 60
  health_check_interval_seconds: 30
  metrics_file: /opt/trading_bot/logs/metrics.json

reporting:
  telegram:
    enabled: true
    chat_id: ${TELEGRAM_CHAT_ID}
    bot_token_env: TELEGRAM_BOT_TOKEN
  daily_report_local: /opt/trading_bot/reports/daily/
